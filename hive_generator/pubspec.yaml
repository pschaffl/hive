name: hive_generator
description: Extension for Hive. Automatically generates TypeAdapters to store any class.
version: 2.0.1
homepage: https://github.com/hivedb/hive/tree/master/hive_generator
documentation: https://docs.hivedb.dev/

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  build: ^2.0.0
  source_gen: ^2.0.0
  hive:
    git:
      url: https://github.com/pschaffl/hive.git
      path: hive
      ref: release
  analyzer: ">=7.0.0 <8.0.0"
  source_helper: ^1.3.5

dev_dependencies:
  test: ^1.17.11
  build_test: any
  build_runner: any
  pedantic: ^1.11.1
